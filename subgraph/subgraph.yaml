# Coalition ResourcePool subgraph — Arc testnet (chain 5042002).
#
# Pool: 0x8b9f38c7B005Dd67203e27240F45335a9e64F692
# Pool state at scaffold time: target 10 USDC (10000000 atomic, 6-dec),
# totalCommitted 0, settled false.
#
# Event shapes are derived from sdk/src/pool/abi.ts (generated from
# contracts/out/ResourcePool.sol/ResourcePool.json — never invent signatures).

specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ResourcePool
    # Subgraph Studio network slug for Arc testnet (chain id 5042002,
    # RPC https://rpc.testnet.arc.network). If Studio rejects this slug,
    # check the Studio UI network list and replace it — the address,
    # startBlock, ABI, and handlers below stay the same.
    network: arc-testnet
    source:
      address: "0x8b9f38c7B005Dd67203e27240F45335a9e64F692"
      abi: ResourcePool
      # Arc testnet latest was 61057595 at scaffold time (2026-09-08);
      # startBlock is latest minus 1000 as a safety margin. Refresh before
      # deploy if the pool predates this block:
      #   cast block-number --rpc-url https://rpc.testnet.arc.network
      startBlock: 61221987
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - Commitment
        - Dropout
        - Settlement
        - Refund
        - Expiry
        - Completion
      abis:
        - name: ResourcePool
          file: ./abis/ResourcePool.json
      eventHandlers:
        - event: Committed(indexed address,uint256)
          handler: handleCommitted
        - event: Settled(uint256)
          handler: handleSettled
        - event: DroppedOut(indexed address,uint256)
          handler: handleDroppedOut
        - event: ExpiredFinalized(uint256,uint256)
          handler: handleExpiredFinalized
        - event: Refunded(indexed address,uint256)
          handler: handleRefunded
        - event: CompletionRecorded(indexed uint256,int128)
          handler: handleCompletionRecorded
      file: ./src/mapping.ts
